name: RJP Daily — Publicar atualização OTA
# Publica automaticamente apenas quando package.json muda na branch main.
# Para mudanças nativas, compilar e instalar uma nova APK antes de atualizar a baseline.
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      min_native_version:
        description: 'APK mínima compatível (deixar vazio para usar a base nativa validada)'
        required: false
      notes:
        description: 'Resumo das alterações sem dados pessoais'
        required: false
        default: 'Melhorias e correções da RJP Daily'
permissions:
  contents: write
concurrency:
  group: rjp-daily-ota-release
  cancel-in-progress: false
jobs:
  publish:
    name: Testar e publicar OTA compatível
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar compatibilidade, testar, compilar e publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RJP_MIN_NATIVE: ${{ inputs.min_native_version || '' }}
          RJP_RELEASE_NOTES: ${{ inputs.notes || 'Melhorias e correções da RJP Daily' }}
        run: bash scripts/publish-ota.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RJP-Daily-OTA-${{ github.run_number }}
          path: ota-release/rjp-daily-web.zip
          if-no-files-found: ignore
