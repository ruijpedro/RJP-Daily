name: Agenda RJP — WebApp e APK Android
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar parser PT-PT
        run: npm test
      - name: Compilar WebApp
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Daily-WebApp
          path: dist/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # O ubuntu-latest já dispõe do Android SDK. Evita a instalação
      # do pacote obsoleto "tools" pela action setup-android@v3.
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER" || { echo "sdkmanager não encontrado"; exit 1; }
          echo "Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Gerar projeto Android e aplicar permissões
        run: npm run android:prepare
      - name: Confirmar nome nativo e identificador Android
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<string name="app_name">Agenda RJP</string>' android/app/src/main/res/values/strings.xml
          grep -Fq '<string name="title_activity_main">Agenda RJP</string>' android/app/src/main/res/values/strings.xml
          grep -Fq '"appId": "pt.rjp.daily"' capacitor.config.json
          echo 'Nome no launcher: Agenda RJP | Pacote: pt.rjp.daily'
      - name: Preparar assinatura estável (quando configurada)
        env:
          RJP_DAILY_KEYSTORE_B64: ${{ secrets.RJP_DAILY_KEYSTORE_B64 }}
          RJP_DAILY_KEYSTORE_PASSWORD: ${{ secrets.RJP_DAILY_KEYSTORE_PASSWORD }}
          RJP_DAILY_KEY_ALIAS: ${{ secrets.RJP_DAILY_KEY_ALIAS }}
          RJP_DAILY_KEY_PASSWORD: ${{ secrets.RJP_DAILY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Não aceitar uma assinatura incompleta em silêncio.
          configured=0
          for variable in RJP_DAILY_KEYSTORE_B64 RJP_DAILY_KEYSTORE_PASSWORD RJP_DAILY_KEY_ALIAS RJP_DAILY_KEY_PASSWORD; do
            if [[ -n "${!variable:-}" ]]; then configured=$((configured+1)); fi
          done
          if [[ "$configured" -gt 0 && "$configured" -lt 4 ]]; then
            echo "::error::Assinatura Android incompleta: configura os quatro repository secrets."
            exit 1
          fi
          if [[ "$configured" -eq 4 ]]; then
            if ! printf '%s' "$RJP_DAILY_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/rjp-release.jks"; then
              echo "::error::O segredo RJP_DAILY_KEYSTORE_B64 não contém Base64 válido."
              exit 1
            fi
            # Validar o certificado, o alias e a palavra-passe sem imprimir dados sensíveis.
            if ! keytool -list -keystore "$GITHUB_WORKSPACE/android/app/rjp-release.jks" \
                -storepass "$RJP_DAILY_KEYSTORE_PASSWORD" -alias "$RJP_DAILY_KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::Falha ao abrir o JKS: verifica o conteúdo Base64, a palavra-passe e o alias nos secrets."
              exit 1
            fi
            echo "Certificado JKS e alias verificados."
            # O fingerprint é público; a chave privada continua protegida.
            keytool -exportcert -rfc -keystore "$GITHUB_WORKSPACE/android/app/rjp-release.jks" \
              -storepass "$RJP_DAILY_KEYSTORE_PASSWORD" -alias "$RJP_DAILY_KEY_ALIAS" \
              | openssl x509 -noout -fingerprint -sha1
            echo "A compilar APK RELEASE com assinatura permanente."
            echo "RJP_DAILY_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/rjp-release.jks" >> "$GITHUB_ENV"
            echo "RJP_DAILY_KEYSTORE_PASSWORD=$RJP_DAILY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RJP_DAILY_KEY_ALIAS=$RJP_DAILY_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RJP_DAILY_KEY_PASSWORD=$RJP_DAILY_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RJP_BUILD_RELEASE=1" >> "$GITHUB_ENV"
          else
            echo 'Sem secrets de assinatura: APK DEBUG de testes (sem garantia de atualizações por cima).'
            echo 'RJP_BUILD_RELEASE=0' >> "$GITHUB_ENV"
          fi
      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          if [[ "$RJP_BUILD_RELEASE" == "1" ]]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
      - name: SHA-1 da assinatura (para configurar Google Cloud)
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          echo "APK: $APK"
          if [[ "$RJP_BUILD_RELEASE" == "1" ]]; then
            echo 'APK RELEASE: certificado SHA-1 da assinatura permanente'
          else
            echo 'APK DEBUG: SHA-1 temporária, não usar para versão de produção'
          fi
          keytool -printcert -jarfile "$APK" | grep -E 'SHA1:|SHA256:|Owner:' || true
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Daily-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
